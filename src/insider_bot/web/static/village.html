<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#8cabd9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1d21" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="インサイダーゲームの役職とお題を、参加者それぞれのスマホに配ります。"
    />
    <title>インサイダー — 配役</title>
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/village.css" />
    <script type="module" src="/static/village.js"></script>
  </head>
  <body>
    <!-- アイコン。線で描くものは stroke、塗るものは fill を使う -->
    <svg hidden aria-hidden="true" focusable="false">
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M15 4.5 7.5 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <g fill="currentColor"><circle cx="5" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="19" cy="12" r="2" /></g>
      </symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="2.5" y="5.5" width="19" height="13" rx="2.5" />
          <path d="M6.5 9.5h.01M10.2 9.5h.01M13.8 9.5h.01M17.5 9.5h.01M6.5 12.5h.01M10.2 12.5h.01M13.8 12.5h.01M17.5 12.5h.01M8 15.5h8" />
        </g>
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
        </g>
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M3.4 20.6 21.5 12 3.4 3.4 3.4 10.2 15.5 12 3.4 13.8Z" fill="currentColor" />
      </symbol>
      <symbol id="i-house" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /><path d="M12 12.5v5M9.5 15h5" />
        </g>
      </symbol>
      <symbol id="i-crown" viewBox="0 0 24 24">
        <path d="M3 8.5 7.5 12 12 5l4.5 7L21 8.5 19 19H5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-enter" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14" /><path d="M9.5 16.5 14 12 9.5 7.5" /><path d="M14 12H3.5" />
        </g>
      </symbol>
      <symbol id="i-qr" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1" />
          <rect x="14" y="3.5" width="6.5" height="6.5" rx="1" />
          <rect x="3.5" y="14" width="6.5" height="6.5" rx="1" />
          <path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM14 20.5h1.5M20.5 14v1.5" stroke-linecap="round" />
        </g>
      </symbol>
      <symbol id="i-letter" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
          <rect x="3" y="5.5" width="18" height="13" rx="2" /><path d="m3.5 7 8.5 6.5L20.5 7" stroke-linecap="round" />
        </g>
      </symbol>
      <symbol id="i-help" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" /><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.1-2.4 3.6" /><path d="M12 17.2h.01" stroke-width="2.4" />
        </g>
      </symbol>
    </svg>

    <noscript><p class="noscript">この画面は JavaScript を使います。ブラウザの設定で有効にしてください。</p></noscript>

    <div id="talk" class="app" hidden>
      <header class="app-header">
        <a class="icon-button" href="/" aria-label="INSIDER のトップへ戻る"><svg class="icon"><use href="#i-back" /></svg></a>
        <h1 class="app-title">インサイダー</h1>
        <button id="talk-more" type="button" class="icon-button" aria-label="その他" aria-haspopup="dialog">
          <svg class="icon"><use href="#i-more" /></svg>
        </button>
      </header>

      <main id="talk-scroll" class="talk">
        <ol id="talk-log" class="talk-log" aria-label="トーク"></ol>
        <div id="typing" class="msg bot typing" hidden aria-hidden="true">
          <img class="avatar" src="/static/mark.svg" alt="" />
          <div class="msg-main"><p class="bubble"><span></span><span></span><span></span></p></div>
        </div>
      </main>

      <footer class="talk-footer">
        <div id="quick-replies" class="quick-replies" aria-label="クイックリプライ" hidden></div>
        <form id="composer" class="composer">
          <button
            id="menu-toggle"
            type="button"
            class="icon-button"
            aria-controls="rich-menu"
            aria-expanded="true"
            aria-label="メニューを閉じる"
          >
            <svg class="icon icon-keyboard"><use href="#i-keyboard" /></svg
            ><svg class="icon icon-grid"><use href="#i-grid" /></svg>
          </button>
          <input
            id="composer-input"
            class="composer-input"
            aria-label="メッセージ"
            placeholder="メッセージを入力"
            enterkeyhint="send"
            autocomplete="off"
            maxlength="5000"
          />
          <button id="composer-send" type="submit" class="send-button" aria-label="送信" disabled>
            <svg class="icon"><use href="#i-send" /></svg>
          </button>
        </form>
        <nav id="rich-menu" class="rich-menu" aria-label="メニュー">
          <button type="button" class="tile" data-menu="normal">
            <svg class="tile-icon"><use href="#i-house" /></svg><span>村を作る</span><small>あなたが GM</small>
          </button>
          <button type="button" class="tile" data-menu="god">
            <svg class="tile-icon"><use href="#i-crown" /></svg><span>神モード</span><small>GM も参加者から</small>
          </button>
          <button type="button" class="tile" data-menu="join">
            <svg class="tile-icon"><use href="#i-enter" /></svg><span>村に入る</span><small>村番号を入力</small>
          </button>
          <button type="button" class="tile" data-menu="scan">
            <svg class="tile-icon"><use href="#i-qr" /></svg><span>QR で入る</span><small>カメラで読む</small>
          </button>
          <a class="tile" href="/village/special">
            <svg class="tile-icon"><use href="#i-letter" /></svg><span>特殊村</span><small>配る言葉を決める</small>
          </a>
          <button type="button" class="tile" data-menu="help">
            <svg class="tile-icon"><use href="#i-help" /></svg><span>遊び方</span><small>使い方を見る</small>
          </button>
        </nav>
      </footer>
    </div>

    <div id="special" class="app" hidden>
      <header class="app-header">
        <a class="icon-button" href="/village" aria-label="トークに戻る"><svg class="icon"><use href="#i-back" /></svg></a>
        <h1 class="app-title">特殊村を作る</h1>
        <span class="icon-button" aria-hidden="true"></span>
      </header>
      <main class="sheet-page">
        <form id="special-form" class="stack">
          <p class="lead">
            1 行に 1 通。参加した人に 1 通ずつ届きます（届く順は作るときにシャッフルします）。途中の空の行には「メッセージは特にありません。」が届きます。
          </p>
          <label class="field" for="special-input"
            ><span class="field-label">メッセージ <span id="special-count" class="field-note">0 通</span></span
            ><textarea id="special-input" rows="8" required></textarea>
          </label>
          <button id="special-submit" type="submit" class="line-button">特殊村を作る</button>
        </form>
        <div id="special-result" class="stack" hidden>
          <p class="village-number">村番号<strong id="special-number"></strong></p>
          <canvas id="special-qr" class="qr" width="1" height="1" aria-label="村に入る QR コード"></canvas>
          <p id="special-url" class="url"></p>
          <button id="special-copy" type="button" class="line-button">URL をコピー</button>
          <button id="special-again" type="button" class="outline-button">もう 1 つ作る</button>
          <a class="outline-button" href="/village">トークに戻る</a>
        </div>
        <p id="special-message" class="message" role="status"></p>
      </main>
    </div>

    <dialog id="scanner" class="scanner" aria-labelledby="scanner-title">
      <h2 id="scanner-title">QR で村に入る</h2>
      <video id="scanner-video" class="scanner-video" playsinline muted></video>
      <p id="scanner-message" class="scanner-message" role="status"></p>
      <button id="scanner-close" type="button" class="outline-button">閉じる</button>
    </dialog>

    <dialog id="more-sheet" class="action-sheet" aria-label="その他">
      <p class="action-sheet-note">履歴はこの端末にだけ残っています。消しても、村や役職はなくなりません。</p>
      <button id="clear-talk" type="button" class="action-sheet-button danger">トーク履歴を削除</button>
      <button id="more-close" type="button" class="action-sheet-button">キャンセル</button>
    </dialog>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>
  </body>
</html>
